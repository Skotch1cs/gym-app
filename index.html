<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зал">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #0f1115; --card: #1a1d24; --card2: #232731; --text: #f1f3f7; --muted: #8b93a3;
  --accent: #ff7a45; --accent-text: #1a0d06; --danger: #ff5c5c; --line: #2c313c; --good: #4cd18a;
  --finish: #4cd18a; --finish-text: #06281c; --swap: #fbbf24; --info: #38bdf8;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f3f4f7; --card: #ffffff; --card2: #eef0f4; --text: #14161b; --muted: #677083;
    --line: #e1e4ea; --accent-text: #ffffff; --finish: #12a36b; --finish-text: #ffffff; --swap: #b45309; --info: #0369a1; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); min-height: 100vh; }
header { padding: 16px 16px 8px; display: flex; align-items: center; gap: 8px; }
header h1 { font-size: 28px; margin: 0; flex: 1; letter-spacing: -0.5px; }
.back { background: none; border: 0; color: var(--accent); font-size: 17px; padding: 4px 0; cursor: pointer; }
main { padding: 0 16px 16px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 20px 4px 8px; font-weight: 600; }
button { font: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 600; background: var(--card2); color: var(--text); width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.finish { background: var(--finish); color: var(--finish-text); }
.btn.danger { background: none; color: var(--danger); }
.btn.sm { width: auto; padding: 10px 14px; border-radius: 10px; }
.icon-btn { background: none; border: 0; color: var(--muted); font-size: 20px; padding: 4px 8px; line-height: 1; }
.icon-btn.del { color: var(--danger); }
input { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; font-size: 17px; }
input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.set { display: flex; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); gap: 10px; }
.set .n { width: 22px; color: var(--muted); font-size: 14px; }
.set .v { flex: 1; font-variant-numeric: tabular-nums; font-size: 17px; }
.addset { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 10px; align-items: end; }
.addset label { font-size: 12px; color: var(--muted); display: block; margin: 0 0 4px 2px; }
.chip.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.plan-ex { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; align-items: baseline; }
.plan-ex .t { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14px; }
.plan-group { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); font-weight: 700; margin: 14px 0 4px; }
.plan-ex { cursor: pointer; }
.plan-ex .chev { font-size: 16px; width: 10px; text-align: center; }
.tag { font-size: 11px; color: var(--good); font-weight: 700; text-transform: uppercase; margin-left: 4px; }
.panel { padding: 2px 0 10px; }
.info img { width: 100%; aspect-ratio: 724 / 240; border-radius: 10px; display: block; margin: 8px 0; background: var(--card2); }
.swap-title { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; margin-top: 10px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 14px; font-weight: 600; padding: 8px 0 4px; margin-right: 18px; }
.linkbtn.info { color: var(--info); }
.linkbtn.swap { color: var(--swap); }
.target { font-size: 13px; color: var(--accent); margin-top: 2px; font-weight: 600; }
.hint-up { font-size: 13px; color: var(--good); margin-top: 2px; font-weight: 600; }
.rules { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
.rules li { margin-bottom: 6px; }
.rules b { color: var(--text); }
details summary { cursor: pointer; font-weight: 600; font-size: 18px; }
a { color: var(--accent); }
.btn:disabled { opacity: .5; }
.profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.profile-grid label { font-size: 12px; color: var(--muted); display: block; margin: 0 0 4px 2px; }
.prev { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pr { color: var(--good); font-size: 12px; font-weight: 700; margin-left: 6px; }
.list-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.chev { color: var(--muted); font-size: 20px; }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; background: none; border: 0; color: var(--muted); padding: 8px 0 10px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button .i { font-size: 22px; line-height: 1; }
nav button.on { color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--card); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
svg.chart { width: 100%; height: 160px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { background: var(--card2); border: 0; color: var(--text); border-radius: 999px; padding: 8px 12px; font-size: 14px; }
.banner { background: var(--accent); color: var(--accent-text); border-radius: 14px; padding: 14px; margin-bottom: 12px; cursor: pointer; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 10; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-tab="home"><span class="i">🏋️</span>Тренировки</button>
  <button data-tab="plan"><span class="i">📋</span>План</button>
  <button data-tab="exercises"><span class="i">📈</span>Прогресс</button>
  <button data-tab="more"><span class="i">⚙️</span>Ещё</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
const KEY = 'gym-diary-v1';
// name: [image file in img/, short how-to]
const INFO = {
  "Жим лёжа": ["barbell-bench-press-medium-grip", "Лёжа на скамье, лопатки сведены, стопы упираются в пол. Опусти штангу к середине груди и выжми вверх, не отрывая таз."],
  "Жим гантелей лёжа": ["dumbbell-bench-press", "Лёжа на скамье, гантели над грудью. Опусти их по бокам от груди до лёгкого растяжения и выжми вверх, слегка сводя."],
  "Жим лёжа в Смите": ["smith-machine-bench-press", "Как жим штанги, но гриф идёт по направляющим. Поставь скамью так, чтобы гриф опускался на середину груди."],
  "Жим от груди в тренажёре": ["machine-bench-press", "Сядь так, чтобы рукояти были на уровне середины груди. Выжми вперёд, не выпрямляя локти до щелчка, и плавно верни."],
  "Жим гантелей на наклонной": ["incline-dumbbell-press", "Скамья под углом 30–45°. Опусти гантели к верху груди и выжми вверх. Нагружает верх грудных."],
  "Жим штанги на наклонной": ["barbell-incline-bench-press-medium-grip", "Скамья под углом 30–45°. Опусти штангу к верхней части груди и выжми вверх, локти под грифом."],
  "Жим в Смите на наклонной": ["smith-machine-incline-bench-press", "Наклонная скамья под грифом Смита. Опускай гриф к верху груди и выжимай вверх без рывков."],
  "Жим в рычажном тренажёре на наклонной": ["leverage-incline-chest-press", "Сядь в тренажёр, рукояти на уровне верха груди. Выжми вверх и вперёд, медленно верни назад."],
  "Сведение рук в тренажёре": ["butterfly", "Тренажёр «бабочка». Спина прижата, локти чуть согнуты. Сведи руки перед грудью, задержись на секунду и плавно разведи."],
  "Сведение рук в кроссовере": ["cable-crossover", "Стоя между блоками, рукояти сверху. Чуть наклонись и сведи руки перед собой по дуге, локти слегка согнуты."],
  "Разводка гантелей лёжа": ["dumbbell-flyes", "Лёжа на скамье, руки чуть согнуты. Разведи гантели в стороны до растяжения груди и сведи обратно по дуге."],
  "Отжимания на брусьях": ["dips-chest-version", "Наклони корпус вперёд, локти слегка в стороны. Опустись до прямого угла в локтях и выжми себя вверх."],
  "Отжимания от пола": ["pushups", "Упор лёжа, тело прямое, ладони чуть шире плеч. Опустись грудью почти до пола и отожмись."],
  "Разводка гантелей на наклонной": ["incline-dumbbell-flyes", "Скамья под углом около 30°. Разведи гантели в стороны до растяжения и сведи над грудью по дуге."],
  "Тяга штанги в наклоне": ["bent-over-barbell-row", "Наклон корпуса около 45°, спина прямая, колени чуть согнуты. Тяни штангу к низу живота, сводя лопатки."],
  "Тяга гантели одной рукой": ["one-arm-dumbbell-row", "Упрись коленом и рукой в скамью, спина ровная. Тяни гантель к поясу, локоть идёт вдоль корпуса."],
  "Тяга Т-грифа": ["t-bar-row-with-handle", "Стоя над грифом в наклоне, спина прямая. Тяни рукоять к животу и медленно опускай."],
  "Тяга в наклоне в Смите": ["smith-machine-bent-over-row", "Наклон около 45°, спина прямая. Тяни гриф Смита к низу живота, сводя лопатки."],
  "Тяга верхнего блока": ["wide-grip-lat-pulldown", "Широкий хват, бёдра под валиками. Тяни рукоять к верху груди, локти вниз, корпус почти не раскачивай."],
  "Подтягивания": ["pullups", "Хват чуть шире плеч. Подтянись подбородком выше перекладины и опустись до почти прямых рук без рывков."],
  "Тяга верхнего блока узким хватом": ["v-bar-pulldown", "Узкая V-рукоять, ладони друг к другу. Тяни к верху груди, слегка отклонившись назад."],
  "Тяга верхнего блока обратным хватом": ["underhand-cable-pulldowns", "Хват снизу на ширине плеч. Тяни рукоять к верху груди, локти идут вдоль корпуса."],
  "Тяга горизонтального блока": ["seated-cable-rows", "Сидя, спина прямая, колени чуть согнуты. Тяни рукоять к животу, сводя лопатки, и плавно возвращай."],
  "Тяга в рычажном тренажёре": ["leverage-iso-row", "Грудь упирается в подушку. Тяни рукояти к себе, сводя лопатки, и медленно возвращай."],
  "Тяга гантелей лёжа на наклонной скамье": ["dumbbell-incline-row", "Ляг грудью на наклонную скамью. Тяни гантели к поясу, сводя лопатки. Поясница при этом разгружена."],
  "Пуловер на верхнем блоке": ["straight-arm-pulldown", "Стоя лицом к блоку, руки почти прямые. Потяни рукоять по дуге к бёдрам за счёт широчайших."],
  "Пуловер с канатом на блоке": ["rope-straight-arm-pulldown", "Как пуловер с прямой рукоятью, но с канатом: тяни прямыми руками по дуге к бёдрам, в конце разводи концы каната."],
  "Пуловер с гантелью": ["straight-arm-dumbbell-pullover", "Лёжа на скамье, гантель над грудью. Опусти её за голову до растяжения и верни обратно почти прямыми руками."],
  "Присед со штангой": ["barbell-squat", "Штанга на трапециях, стопы на ширине плеч. Опустись до параллели бёдер с полом, спина прямая, колени смотрят в сторону носков."],
  "Присед в Смите": ["smith-machine-squat", "Гриф на трапециях, стопы чуть впереди. Присядь до параллели и встань, не отрывая пятки."],
  "Гакк-присед": ["hack-squat", "Спина прижата к подушке тренажёра, стопы на платформе. Опустись до прямого угла в коленях и выжми платформу."],
  "Гоблет-присед": ["goblet-squat", "Держи гирю или гантель у груди. Присядь глубоко, локти между коленями, спина прямая, и встань."],
  "Румынская тяга": ["romanian-deadlift", "Колени чуть согнуты, спина прямая. Отводи таз назад и опускай штангу вдоль ног до середины голени, затем выпрямись."],
  "Румынская тяга с гантелями": ["stiff-legged-dumbbell-deadlift", "То же движение с гантелями: таз назад, спина прямая, гантели скользят вдоль ног."],
  "Тяга на прямых ногах в Смите": ["smith-machine-stiff-legged-deadlift", "Гриф Смита в опущенных руках. Отводи таз назад с прямой спиной и опускай гриф вдоль ног."],
  "Гиперэкстензия": ["hyperextensions-back-extensions", "Бёдра на подушке, пятки под валиками. Опустись вниз с прямой спиной и поднимись до прямой линии тела."],
  "Жим ногами": ["leg-press", "Стопы на платформе на ширине плеч. Опусти платформу до прямого угла в коленях и выжми, не выпрямляя ноги до конца. Поясницу не отрывай."],
  "Выпады с гантелями": ["dumbbell-lunges", "Шагни вперёд и опустись, пока оба колена не согнутся под прямым углом. Оттолкнись и вернись."],
  "Болгарские выпады": ["split-squat-with-dumbbells", "Задняя нога на скамье. Приседай на передней ноге до параллели бедра с полом, корпус ровный."],
  "Разгибания ног": ["leg-extensions", "Сидя в тренажёре, валик на голеностопах. Разогни ноги до конца, задержись на секунду и плавно опусти."],
  "Сгибания ног": ["lying-leg-curls", "Лёжа в тренажёре, валик чуть выше пяток. Согни ноги, подтягивая валик к ягодицам, таз не отрывай."],
  "Сгибания ног сидя": ["seated-leg-curl", "Сидя в тренажёре, валик на голенях сзади. Согни ноги под себя и плавно верни."],
  "Сгибания ног стоя": ["standing-leg-curl", "Стоя в тренажёре, сгибай одну ногу, подтягивая валик к ягодице. Потом поменяй ногу."],
  "«Доброе утро» со штангой": ["stiff-leg-barbell-good-morning", "Штанга на плечах, колени чуть согнуты. Наклонись вперёд с прямой спиной, отводя таз назад, и выпрямись. Бери лёгкий вес."],
  "Подъём на носки": ["standing-calf-raises", "Стоя в тренажёре, носки на платформе. Поднимись на носки как можно выше, задержись и опусти пятки ниже платформы."],
  "Подъём на носки сидя": ["seated-calf-raise", "Сидя в тренажёре, валик на коленях. Поднимай и опускай пятки с полной амплитудой."],
  "Подъём на носки в жиме ногами": ["calf-press-on-the-leg-press-machine", "В тренажёре для жима ногами поставь на край платформы только носки. Выжимай платформу стопами, ноги почти прямые."],
  "Подъём на носки с гантелями": ["standing-dumbbell-calf-raise", "Стоя с гантелями, носки на возвышении. Поднимись на носки и медленно опусти пятки вниз."],
  "Жим гантелей сидя": ["dumbbell-shoulder-press", "Сидя, спина прижата к спинке, гантели на уровне ушей. Выжми вверх и опусти до прямого угла в локтях."],
  "Жим штанги стоя": ["standing-military-press", "Штанга на груди, хват чуть шире плеч. Выжми над головой, пресс и ягодицы напряжены, не отклоняйся назад."],
  "Жим в тренажёре на плечи": ["machine-shoulder-military-press", "Сидя в тренажёре, рукояти на уровне плеч. Выжми вверх и плавно опусти."],
  "Жим Арнольда": ["arnold-dumbbell-press", "Гантели перед собой ладонями к себе. Выжимая вверх, разворачивай ладони от себя, на опускании верни обратно."],
  "Махи гантелями в стороны": ["side-lateral-raise", "Стоя, локти чуть согнуты. Подними гантели через стороны до уровня плеч и медленно опусти. Без рывков корпусом."],
  "Махи в стороны на блоке": ["standing-low-pulley-deltoid-raise", "Стоя боком к нижнему блоку, рукоять в дальней руке. Подними руку через сторону до уровня плеча и плавно опусти. Потом поменяй руку."],
  "Махи гантелями в стороны сидя": ["seated-side-lateral-raise", "Сидя на скамье, подними гантели через стороны до уровня плеч. Сидя сложнее помогать себе корпусом."],
  "Тяга штанги к подбородку": ["upright-barbell-row", "Хват чуть шире плеч. Тяни штангу вдоль корпуса до уровня груди, локти выше кистей."],
  "Тяга к лицу на блоке": ["face-pull", "Канат на верхнем блоке. Тяни к лицу, разводя концы каната и поднимая локти. Работают задние дельты."],

const GROUP = Object.fromEntries(GROUPS.map(g => [g.id, g]));
const MAX_EXERCISES = 7;
const DEFAULT_PLAN = { days: [['shoulders', 'biceps'], ['back', 'legs'], ['chest', 'triceps']], next: 0, swaps: {} };
// Which plan slot an exercise belongs to (as the main exercise or as a substitute).
const SLOT_OF = {};
for (const g of GROUPS) for (const e of g.ex) SLOT_OF[e.name] = e;
for (const g of GROUPS) for (const e of g.ex) for (const a of e.alt) SLOT_OF[a] ??= e;
// Exercises that can stand in for `current` in the slot `slotName`, leaving out ones already taken.
function optionsFor(slotName, current, taken) {
  const slot = SLOT_OF[slotName];
  return slot ? [slot.name, ...slot.alt].filter(n => n !== current && !taken.includes(n)) : [];
}
const DEFAULT_EXERCISES = Object.keys(INFO);

// Build the exercise list for a set of muscle groups: a group trained alone gets all its
// exercises, otherwise its default count, trimmed so the workout stays at MAX_EXERCISES.
function buildDay(ids) {
  const groups = GROUPS.filter(g => ids.includes(g.id));
  const counts = groups.map(g => groups.length === 1 ? g.ex.length : g.n);
  const total = () => counts.reduce((a, b) => a + b, 0);
  for (const floor of [2, 1]) {
    while (total() > MAX_EXERCISES && Math.max(...counts) > floor) counts[counts.lastIndexOf(Math.max(...counts))]--;
  }
  const day = groups.map((g, i) => ({ group: g, ex: g.ex.slice(0, counts[i]).map(e => ({ ...e, slot: e.name })) }));
  // Apply saved substitutions, skipping one that would repeat an exercise already in the day.
  const used = new Set(day.flatMap(g => g.ex.map(e => e.name)));
  for (const g of day) for (const e of g.ex) {
    const sw = db.plan.swaps[e.slot];
    if (sw && e.alt.includes(sw) && !used.has(sw)) { used.delete(e.name); e.name = sw; used.add(sw); }
  }
  return day;
}
const dayName = ids => GROUPS.filter(g => ids.includes(g.id)).map(g => g.name).join(', ');

function withProfile(d) {
  d.profile = Object.assign({}, DEFAULT_PROFILE, d.profile);
  if (!d.plan || !Array.isArray(d.plan.days) || !d.plan.days.length) d.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
  d.plan.days = d.plan.days.map(day => (Array.isArray(day) ? day : []).filter(id => GROUP[id]));
  if (!(d.plan.next >= 0 && d.plan.next < d.plan.days.length)) d.plan.next = 0;

function allExerciseNames() {

  for (const w of sorted()) for (const ex of w.exercises) if (!used.has(ex.name)) used.set(ex.name, w.date);
  const names = [...used.keys()];
  for (const n of DEFAULT_EXERCISES) if (!used.has(n)) names.push(n);

// All past sessions for an exercise (newest first), excluding a given workout.
function historyFor(name, excludeId) {
  const out = [];
  for (const w of sorted()) {
    if (w.id === excludeId) continue;
    const ex = w.exercises.find(e => e.name === name);
    if (ex && ex.sets.length) out.push({ date: w.date, sets: ex.sets, wid: w.id });

}

function lastInSlot(ex, excludeId) {

  for (const w of sorted()) {
    if (w.id === excludeId) continue;
    const x = w.exercises.find(e => (e.slot || e.name) === slot && e.sets.length);
    if (x) return x.name === ex.name ? null : { name: x.name, date: w.date, sets: x.sets };
  }
  return null;
}
function bestWeight(name, excludeId) {
  let best = 0;
  for (const h of historyFor(name, excludeId)) for (const s of h.sets) best = Math.max(best, s.w);

}

        <div class="muted small">${sets} подх. · ${fmtNum(Math.round(volume(w)))} кг общий тоннаж</div>
      </div><span class="chev">›</span></div>`;
    }
  }
  return h + `</main>`;
}

function viewWorkout(id) {
  const w = db.workouts.find(x => x.id === id);
  if (!w) return go('home');
  let h = `<header><button class="back" data-act="home">‹ Назад</button><span class="grow"></span>
    ${w.done ? '' : `<button class="btn finish sm" data-act="finish" data-id="${w.id}">Завершить</button>`}</header>
    <main><h1 style="font-size:26px;margin:0 0 4px">${esc(fmtDate(w.date))}</h1>
    ${w.title ? `<div class="target" style="font-size:15px">${esc(w.title)}</div>` : ''}
    <div class="muted" style="margin-bottom:14px">${w.done ? 'Завершена' : 'Идёт тренировка'} · ${fmtNum(Math.round(volume(w)))} кг тоннаж</div>`;
  w.exercises.forEach((ex, i) => {
    const prev = historyFor(ex.name, w.id)[0];
    const best = bestWeight(ex.name, w.id);
    const last = ex.sets[ex.sets.length - 1] || (prev && prev.sets[0]) || null;
    const t = ex.target;
    const other = lastInSlot(ex, w.id);
    const addWeight = t && prev && prev.sets.length >= t.sets && prev.sets.every(x => x.r >= t.reps[1]);
    h += `<div class="card"><div class="row"><div class="grow"><h2>${esc(ex.name)}</h2>
      ${t ? `<div class="target">План: ${t.sets} × ${repsText(t.reps)} · отдых ${esc(t.rest)} мин · сделано ${ex.sets.length}/${t.sets}</div>` : ''}
      ${addWeight ? `<div class="hint-up">↑ В прошлый раз все подходы по ${t.reps[1]}+ повторов: добавь 2,5–5 кг</div>` : ''}
      <div class="prev">${prev ? `Прошлый раз (${esc(fmtDate(prev.date, false))}): ${setsText(prev.sets)}` : 'Первый раз'}</div>
      ${other ? `<div class="prev">В прошлый раз вместо него: ${esc(other.name)} (${esc(fmtDate(other.date, false))}): ${setsText(other.sets)}</div>` : ''}</div>
      <button class="icon-btn del" data-act="del-ex" data-i="${i}" aria-label="Удалить упражнение">✕</button></div>`;
    const options = w.done ? [] : optionsFor(ex.slot || ex.name, ex.name, w.exercises.map(x => x.name));
    const kInfo = `w|${i}|info`, kSwap = `w|${i}|swap`;
    if (INFO[ex.name] || options.length) h += `<div>${INFO[ex.name] ? `<button class="linkbtn info" data-act="toggle-panel" data-key="${kInfo}">${openKey === kInfo ? 'Скрыть технику' : 'Как делать'}</button>` : ''}
      ${options.length ? `<button class="linkbtn swap" data-act="toggle-panel" data-key="${kSwap}">${openKey === kSwap ? 'Не менять' : 'Заменить'}</button>` : ''}</div>`;
    if (openKey === kInfo) h += `<div class="panel">${infoHtml(ex.name)}</div>`;
    if (openKey === kSwap) h += `<div class="panel">${swapChips(options, 'w-swap', `data-i="${i}"`)}</div>`;
    ex.sets.forEach((s, j) => {
      const isPR = best > 0 && s.w > best && ex.sets.findIndex(x => x.w === s.w) === j;
      h += `<div class="set"><span class="n">${j + 1}</span><span class="v">${fmtNum(s.w)} кг × ${s.r}${isPR ? '<span class="pr">РЕКОРД</span>' : ''}</span>
        <button class="icon-btn del" data-act="del-set" data-i="${i}" data-j="${j}" aria-label="Удалить подход">−</button></div>`;
    });
    h += `<form class="addset" data-i="${i}">
      <div><label>Вес, кг</label><input name="w" inputmode="decimal" value="${last ? fmtNum(last.w) : ''}" placeholder="0"></div>
      <div><label>Повторы</label><input name="r" inputmode="numeric" value="${last ? last.r : ''}" placeholder="${t ? repsText(t.reps) : '0'}"></div>
      <button class="btn primary sm" type="submit">+ Подход</button></form></div>`;
  });
  h += `<div class="card"><form id="addex" class="row"><input name="name" list="exlist" placeholder="Название упражнения" autocomplete="off">
    <button class="btn sm" type="submit">Добавить</button></form>
    <datalist id="exlist">${allExerciseNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="chips">${allExerciseNames().filter(n => !w.exercises.some(e => e.name === n)).slice(0, 8)
      .map(n => `<button class="chip" data-act="add-ex" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`;
  h += `<button class="btn danger" data-act="del-workout" data-id="${w.id}">Удалить тренировку</button>`;
  if (w.done) h += `<button class="btn" data-act="reopen" data-id="${w.id}" style="margin-top:8px">Продолжить эту тренировку</button>`;
  return h + `</main>`;
}

function viewPlan() {
  const busy = !!active();
  let h = `<header><h1>План</h1></header><main>
    <div class="muted" style="margin:0 4px 12px">${db.plan.days.length} тренировки в неделю. Отметь группы мышц для каждого дня, упражнения подберутся сами. Нажми на упражнение, чтобы посмотреть технику или заменить его на аналог.</div>`;
  db.plan.days.forEach((ids, d) => {
    const day = buildDay(ids);
    const dayNames = day.flatMap(g => g.ex.map(e => e.name));
    const nEx = day.reduce((a, g) => a + g.ex.length, 0), nSets = day.reduce((a, g) => a + g.ex.reduce((b, e) => b + e.sets, 0), 0);
    h += `<div class="card"><div class="row"><h2 class="grow">День ${d + 1}${d === db.plan.next ? ' <span class="pr">СЛЕДУЮЩИЙ</span>' : ''}</h2></div>
      <div class="chips">${GROUPS.map(g => `<button class="chip${ids.includes(g.id) ? ' on' : ''}" data-act="toggle-group" data-day="${d}" data-group="${g.id}">${g.name}</button>`).join('')}</div>`;
    if (!day.length) h += `<div class="muted" style="margin-top:12px">Выбери хотя бы одну группу мышц.</div>`;
    for (const g of day) {
      h += `<div class="plan-group">${g.group.name}</div>`;
      for (const e of g.ex) {
        const key = `p|${d}|${e.slot}`, open = openKey === key;
        h += `<div class="plan-ex" data-act="toggle-panel" data-key="${esc(key)}"><span class="grow">${esc(e.name)}${e.name !== e.slot ? ' <span class="tag">замена</span>' : ''}</span>
          <span class="t">${e.sets} × ${repsText(e.reps)}</span><span class="chev">${open ? '⌄' : '›'}</span></div>`;
        if (open) h += `<div class="panel">${infoHtml(e.name)}${swapChips(optionsFor(e.slot, e.name, dayNames), 'plan-swap', `data-slot="${esc(e.slot)}"`)}</div>`;
      }
    }
    if (day.length) h += `<div class="muted small" style="margin:10px 0">${nEx} упр. · ${nSets} подх. · примерно ${Math.round(nSets * 3.2 / 5) * 5} мин</div>
      <button class="btn primary" data-act="start-plan" data-day="${d}" ${busy ? 'disabled' : ''}>${busy ? 'Сначала заверши текущую тренировку' : 'Начать эту тренировку'}</button>`;
    h += `</div>`;
  });
  const used = new Set(db.plan.days.flat());
  const missing = GROUPS.filter(g => !used.has(g.id)).map(g => g.name);
  if (missing.length) h += `<div class="card"><b>Не попали в план:</b> <span class="muted">${missing.join(', ')}. Добавь их в любой день, если хочешь тренировать.</span></div>`;
  h += `<div class="card"><h2>Как тренироваться</h2><ol class="rules">
      <li><b>Разминка.</b> Перед первым упражнением сделай 2–3 лёгких подхода с постепенным набором веса.</li>
      <li><b>Вес.</b> Подбирай так, чтобы в конце подхода оставалось 1–2 повтора в запасе. Последний подход упражнения можно делать почти до отказа.</li>
      <li><b>Прогресс.</b> Работай в указанном диапазоне повторов. Когда во всех подходах дошёл до верхней границы, в следующий раз добавь 2,5–5 кг. Приложение подскажет.</li>
      <li><b>Отдых.</b> В тяжёлых базовых упражнениях 2–3 минуты, в остальных 1–2 минуты.</li>
      <li><b>Восстановление.</b> Между тренировками хотя бы один день отдыха, например пн, ср, пт.</li>
    </ol></div>
    <div class="card"><details><summary>На чём основан план</summary><ol class="rules">
      <li><b>Порядок и повторы.</b> Сначала тяжёлое базовое упражнение на 6–8 повторов, затем вспомогательные на 8–12 и изолирующие на 12–20, с двойной прогрессией. Так устроена популярная программа <a href="https://www.liftosaur.com/programs/metallicadpappl" target="_blank" rel="noopener">Push/Pull/Legs с Reddit</a>.</li>
      <li><b>Подходы и отдых.</b> 2–4 подхода на упражнение близко к отказу, отдых 2–3 минуты в базе и 1–2 в изоляции, как в программе Джеффа Ниппарда, которую <a href="https://barbend.com/jeff-nippard-pure-bodybuilding-program" target="_blank" rel="noopener">разбирал доктор Майк Израетел</a>.</li>
      <li><b>Объём.</b> Около 9–13 подходов на группу в неделю. Это стартовый уровень по системе <a href="https://rpstrength.com/training-volume-landmarks-muscle-growth/" target="_blank" rel="noopener">Renaissance Periodization</a>, дальше его можно повышать.</li>
      <li><b>Сочетания мышц.</b> Одна большая группа плюс маленькая на тренировку, как советует <a href="https://www.mentoday.ru/fitness/training/kakie-myshechnye-gruppy-nado-prorabatyvat-vmeste-dlya-maksimalnogo-rosta/" target="_blank" rel="noopener">тренер Гэвин Уолш</a>. Он же предупреждает, что спина и ноги в один день дают очень тяжёлую тренировку.</li>
      <li><b>Частота.</b> По <a href="https://pubmed.ncbi.nlm.nih.gov/27102172/" target="_blank" rel="noopener">обзору Шонфельда 2016 года</a> тренировать мышцу дважды в неделю выгоднее, чем один раз. <a href="https://mennohenselmans.com/?p=8631" target="_blank" rel="noopener">Более поздний анализ</a> показал, что при равном недельном объёме частота почти не важна. Поэтому сплит «каждая группа раз в неделю» рабочий, если не пропускать подходы.</li>
    </ol></details></div>`;
  return h + `</main>`;
}

function viewExercises() {
  const names = [];
  const seen = new Set();
  for (const w of sorted()) for (const ex of w.exercises) if (ex.sets.length && !seen.has(ex.name)) { seen.add(ex.name); names.push(ex.name); }
  let h = `<header><h1>Прогресс</h1></header><main>`;
  if (!names.length) return h + `<div class="empty">Запиши хотя бы одну тренировку, и здесь появится прогресс по каждому упражнению.</div></main>`;
  for (const n of names) {
    const hist = historyFor(n);
    h += `<div class="card list-item" data-act="ex" data-name="${esc(n)}"><div class="grow"><h2>${esc(n)}</h2>
      <div class="muted">Макс. вес ${fmtNum(bestWeight(n))} кг · ${hist.length} трен. · последняя ${esc(fmtDate(hist[0].date, false))}</div></div><span class="chev">›</span></div>`;
  }
  return h + `</main>`;
}

function viewExercise(name) {
  const hist = historyFor(name);
  const pts = hist.slice().reverse().map(x => ({ date: x.date, max: Math.max(...x.sets.map(s => s.w)), e: Math.max(...x.sets.map(e1rm)) }));
  const best = bestWeight(name);
  const best1rm = Math.max(0, ...pts.map(p => p.e));
  let h = `<header><button class="back" data-act="tab-exercises">‹ Прогресс</button></header><main>
    <h1 style="font-size:26px;margin:0 0 12px">${esc(name)}</h1>
    <div class="stats"><div class="stat"><b>${fmtNum(best)}</b><span>макс. вес, кг</span></div>
    <div class="stat"><b>${fmtNum(Math.round(best1rm))}</b><span>расч. 1ПМ, кг</span></div>
    <div class="stat"><b>${hist.length}</b><span>тренировок</span></div></div>`;
  if (INFO[name]) h += `<div class="card" style="padding-top:4px">${infoHtml(name)}</div>`;
  if (pts.length > 1) h += `<div class="card"><div class="muted small" style="margin-bottom:6px">Максимальный вес по тренировкам</div>${chart(pts)}</div>`;
  h += `<h3>История</h3>`;
  for (const x of hist) h += `<div class="card list-item" data-act="open" data-id="${x.wid}"><div class="grow"><b>${esc(fmtDate(x.date))}</b>
    <div class="muted">${setsText(x.sets)}</div></div><span class="chev">›</span></div>`;
  return h + `</main>`;
}

function chart(pts) {
  const W = 320, H = 160, P = { l: 34, r: 10, t: 10, b: 22 };
  const vals = pts.map(p => p.max);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.1; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => P.l + (pts.length === 1 ? 0 : i * (W - P.l - P.r) / (pts.length - 1));
  const y = v => P.t + (hi - v) * (H - P.t - P.b) / (hi - lo);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.max).toFixed(1)}`).join('');
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/>
      <text x="${P.l - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(t)}</text>`).join('')}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.max)}" r="3.5" fill="var(--accent)"/>`).join('')}
    <text x="${P.l}" y="${H - 6}" font-size="10" fill="var(--muted)">${esc(fmtDate(pts[0].date, false))}</text>
    <text x="${W - P.r}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtDate(pts[pts.length - 1].date, false))}</text>
  </svg>`;
}

function viewMore() {

      Открой эту страницу в Safari, нажми «Поделиться» (квадрат со стрелкой) и выбери «На экран Домой». Приложение будет открываться как обычное и работать без интернета.</div></div>`}
    <div class="card"><h2>Резервная копия</h2><div class="muted" style="margin:6px 0 12px">
      Все записи хранятся только на этом телефоне. Время от времени сохраняй копию, чтобы ничего не потерять.</div>

function render() {
  const v = state.view;
  app.innerHTML = v === 'workout' ? viewWorkout(state.param)
    : v === 'plan' ? viewPlan()
    : v === 'exercises' ? viewExercises()
    : v === 'exercise' ? viewExercise(state.param)
    : v === 'more' ? viewMore() : viewHome();
  const tab = v === 'workout' || v === 'home' ? 'home' : v === 'exercise' ? 'exercises' : v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}

// ---------- actions ----------
function addExercise(w, name) {
  name = name.trim().replace(/\s+/g, ' ');
  if (!name) return;
  const known = allExerciseNames().find(n => n.toLowerCase() === name.toLowerCase());
  name = known || name.charAt(0).toUpperCase() + name.slice(1);
  if (w.exercises.some(e => e.name === name)) return toast('Уже есть в тренировке');
  w.exercises.push({ name, sets: [] });
  save(); render();
  const forms = app.querySelectorAll('form.addset');
  const f = forms[forms.length - 1];
  if (f) f.scrollIntoView({ block: 'center' });
}

app.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, w = state.view === 'workout' ? db.workouts.find(x => x.id === state.param) : null;
  switch (a) {
    case 'start': {
      const nw = { id: uid(), date: new Date().toISOString(), done: false, exercises: [] };
      db.workouts.push(nw); save(); go('workout', nw.id); break;
    }
    case 'start-plan': {
      if (active()) return toast('Сначала заверши текущую тренировку');
      const d = +el.dataset.day, ids = db.plan.days[d];
      const exercises = buildDay(ids).flatMap(g => g.ex.map(e => ({ name: e.name, slot: e.slot, sets: [], target: { sets: e.sets, reps: e.reps, rest: e.rest } })));
      if (!exercises.length) return toast('Сначала выбери группы мышц');
      const nw = { id: uid(), date: new Date().toISOString(), done: false, planDay: d, title: `День ${d + 1} · ${dayName(ids)}`, exercises };
      db.workouts.push(nw); save(); go('workout', nw.id); break;
    }
    case 'toggle-panel': openKey = openKey === el.dataset.key ? null : el.dataset.key; rerender(); break;
    case 'plan-swap': {
      const slot = el.dataset.slot, name = el.dataset.name;
      if (name === slot) delete db.plan.swaps[slot]; else db.plan.swaps[slot] = name;
      save(); rerender(); toast('В плане теперь: ' + name); break;
    }
    case 'w-swap': {
      const ex = w.exercises[+el.dataset.i];
      if (ex.sets.length) return toast('Сначала удали записанные подходы');
      ex.name = el.dataset.name; openKey = null;
      save(); rerender(); toast('Заменено на: ' + ex.name); break;
    }
    case 'toggle-group': {
      const ids = db.plan.days[+el.dataset.day], g = el.dataset.group, y = window.scrollY;
      const k = ids.indexOf(g);
      if (k >= 0) ids.splice(k, 1); else ids.push(g);
      openKey = null; save(); render(); window.scrollTo(0, y); break;
    }
    case 'open': go('workout', el.dataset.id); break;
    case 'home': go('home'); break;
    case 'tab-exercises': go('exercises'); break;
    case 'ex': go('exercise', el.dataset.name); break;
    case 'add-ex': addExercise(w, el.dataset.name); break;
    case 'finish': {
      w.exercises = w.exercises.filter(e => e.sets.length);
      if (!w.exercises.length) { db.workouts = db.workouts.filter(x => x.id !== w.id); save(); toast('Пустая тренировка удалена'); return go('home'); }
      w.done = true;
      if (w.planDay >= 0) db.plan.next = (w.planDay + 1) % db.plan.days.length;
      save(); toast('Тренировка сохранена 💪'); go('home'); break;
    }
    case 'reopen': {
      const cur = active();
      if (cur && cur.id !== w.id) return toast('Сначала заверши текущую тренировку');
      w.done = false; save(); render(); break;
    }
    case 'del-set': w.exercises[+el.dataset.i].sets.splice(+el.dataset.j, 1); save(); render(); break;
    case 'del-ex': {
      const ex = w.exercises[+el.dataset.i];
      if (ex.sets.length && !confirm(`Удалить «${ex.name}» из тренировки?`)) return;
      w.exercises.splice(+el.dataset.i, 1); openKey = null; save(); render(); break;
    }
    case 'del-workout':
      if (!confirm('Удалить тренировку целиком?')) return;
      db.workouts = db.workouts.filter(x => x.id !== el.dataset.id); save(); go('home'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = `trenirovki-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); break;
    }
    case 'import': document.getElementById('importfile').click(); break;
  }
});

app.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target, w = db.workouts.find(x => x.id === state.param);
  if (f.id === 'addex') return addExercise(w, f.name.value);
  if (f.id === 'profile') {
    const weight = parseNum(f.weight.value), height = parseNum(f.height.value), age = parseInt(f.age.value, 10);
    if (!(weight >= 20 && weight <= 400) || !(height >= 100 && height <= 250) || !(age >= 10 && age <= 110)) return toast('Проверь вес, рост и возраст');
    db.profile = { weight, height, age };
    save(); render(); return toast('Профиль сохранён');
  }
  const wt = parseNum(f.w.value), r = parseInt(f.r.value, 10);
  if (!(wt >= 0) || !(r > 0)) return toast('Укажи вес и повторы');
  const ex = w.exercises[+f.dataset.i];
  const prevBest = bestWeight(ex.name, w.id);
  ex.sets.push({ w: wt, r });
  save(); render();
  if (prevBest > 0 && wt > prevBest && ex.sets.filter(s => s.w === wt).length === 1) toast(`Новый рекорд: ${fmtNum(wt)} кг 🔥`);
});

app.addEventListener('change', ev => {
  if (ev.target.id !== 'importfile') return;
  const file = ev.target.files[0];
  if (!file) return;
  file.text().then(t => {
    const d = JSON.parse(t);
    if (!d || !Array.isArray(d.workouts)) throw new Error();
    if (!confirm(`Заменить текущие данные копией (${d.workouts.length} тренировок)?`)) return;
    db = withProfile(d); save(); toast('Данные восстановлены'); render();
  }).catch(() => toast('Не получилось прочитать файл'));
});

document.getElementById('nav').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (b) go(b.dataset.tab);
});

render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
